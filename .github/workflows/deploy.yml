name: Deploy Lymiar Web (GitHub Pages)

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          NEXT_PUBLIC_API_URL: https://api.lymiar.com
          NEXT_PUBLIC_P32_NAVIGATION: "true"
          NEXT_PUBLIC_P33_SEARCH_ENGINE: "true"
          NEXT_PUBLIC_P34_PRODUCT_PAGE: "true"
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.lymiar.com
          NEXT_PUBLIC_P32_NAVIGATION: "true"
          NEXT_PUBLIC_P33_SEARCH_ENGINE: "true"
          NEXT_PUBLIC_P34_PRODUCT_PAGE: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
